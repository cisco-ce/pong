<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Webex Pong</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- <meta name="viewport" content="width=1920" > -->
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="icon" type="image/png" href="assets/logo-transparent.png">
  <link href="fonts/fonts.css" rel="stylesheet" type="text/css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
  <script src="src/config.js"></script>
  <script src="src/collision.js"></script>
  <script src="src/color-picker.js"></script>
  <script src="src/model.js"></script>
  <script src="src/index.js"></script>
</head>

<body>

  <div class="debug"></div>
  <button id="refreshBtn" onclick="location.reload()" ontouchstart="location.reload();event.stopPropagation();" style="display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;padding:8px 24px;border-radius:20px;border:none;background:rgba(0,0,0,0.4);color:white;font-size:18px;cursor:pointer">Refresh</button>

  <div class="field">
    <canvas id="gameCanvas"></canvas>
    <div class="footer">
    </div>
    <div class="message overlay">
      <div class="pill">Player 2 wins</div>
    </div>
    <div class="intro overlay">
      <div class="dialog">
        <div>Let's play P<div class="o-marker"></div>ng<sup>2</sup></div>
      </div>
    </div>
    <div id="startOverlay" class="overlay" style="pointer-events:none">
      <div class="pill" id="startBtn" style="pointer-events:auto">Tap to start</div>
    </div>
  </div>

</body>

</html>
